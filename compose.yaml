services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - zap_data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  proxy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  zap_data:
  caddy_data:
  caddy_config:
