<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Zap API</title><link rel="stylesheet" href="/style.css"><main><small>PROTÓTIPO · UM NÚMERO</small><h1>Minha Zap API</h1><p>Conecte seu WhatsApp e teste sua própria integração.</p><label>Chave de acesso<input id="key" type="password" autocomplete="off" placeholder="API_KEY do seu arquivo .env"></label><button id="enter">Entrar</button><button id="connect">Conectar WhatsApp</button><p id="status" role="status">Informe a chave para começar.</p><img id="qr" alt="QR Code para conectar WhatsApp" hidden><section><h2>Enviar mensagem</h2><label>Telefone com DDI<input id="phone" placeholder="5561999999999"></label><label>Mensagem<textarea id="text" maxlength="4000"></textarea></label><button id="send">Enviar uma mensagem</button></section><section><h2>Mensagens recebidas</h2><p>Últimas 100, mantidas somente enquanto o servidor estiver ligado.</p><pre id="messages"></pre></section></main><script src="/app.js"></script></html>
